
name: Build Routineinfo Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Dependencies
        run: |
          npm ci
          npm install @capacitor/core @capacitor/android @capacitor/cli

      - name: Configure Capacitor
        run: |
          echo '{"appId":"com.sajidhasan.routineinfo","appName":"Routineinfo","webDir":"dist"}' > capacitor.config.json

      - name: Build Web App
        run: npm run build

      - name: Create Android Project
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Routineinfo-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
