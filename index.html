    <script>
      // Gracefully prevent unhandled Vite HMR client errors when WebSocket is closed/disabled in cloud dev environment
      window.addEventListener('error', function (e) {
        if (e && e.message && (e.message.indexOf("reading 'send'") !== -1 || e.message.indexOf("Cannot read properties of undefined") !== -1 && e.filename && e.filename.indexOf('@vite/client') !== -1)) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      });
      window.addEventListener('unhandledrejection', function (e) {
        if (e && e.reason && e.reason.message && e.reason.message.indexOf("reading 'send'") !== -1) {
          e.preventDefault();
        }
      });
    </script>

  </body>
