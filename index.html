<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>BTEB Routine Manager</title>
    <meta name="description" content="Offline Institute Class Routine Manager with class start and end alerts for BTEB polytechnic students." />
    <meta property="og:title" content="BTEB Routine Manager" />
    <meta property="og:description" content="Offline Institute Class Routine Manager with class start and end alerts." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#059669" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Routine" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script>
      // Gracefully intercept and suppress any Vite HMR / PWA client registration send errors
      window.addEventListener('error', function (e) {
        const msg = (e && (e.message || '')) + '';
        const file = (e && (e.filename || '')) + '';
        if (msg.indexOf('send') !== -1 || file.indexOf('@vite') !== -1 || file.indexOf('pwa-entry-point') !== -1) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        const msg = (e && e.reason && (e.reason.message || e.reason)) ? String(e.reason.message || e.reason) : '';
        if (msg.indexOf('send') !== -1 || msg.indexOf('SendBeforeConnect') !== -1) {
          e.preventDefault();
        }
      }, true);
    </script>
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('bteb_routine_app_v1') || localStorage.getItem('bteb_routine_app_state');
          if (raw) {
            var parsed = JSON.parse(raw);
            var mode = parsed && parsed.theme && parsed.theme.mode;
            if (mode === 'dark' || mode === 'glass') {
              document.documentElement.classList.add('dark');
            } else if (mode === 'light') {
              document.documentElement.classList.remove('dark');
            } else if (mode === 'schedule') {
              var now = new Date();
              var cur = now.getHours() * 60 + now.getMinutes();
              if (cur >= 19 * 60 || cur < 6 * 60) {
                document.documentElement.classList.add('dark');
              }
            }
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased selection:bg-emerald-500 selection:text-white min-h-screen transition-colors">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
